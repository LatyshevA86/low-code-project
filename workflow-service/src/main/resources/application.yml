app:
  activities:
    ai:
      enabled: ${APP_AI_ENABLED:false}
      base-url: http://localhost:8090
      profiles:
        HR:
          prompt-resource: classpath:prompts/hr-system.txt
    rest:
      enabled: ${APP_REST_ENABLED:false}

server:
  port: 8083

spring:
  application:
    name: workflow-service
  datasource:
    url: jdbc:postgresql://localhost:5433/workflow-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  temporal:
    connection:
      target: localhost:7233
    namespace: default
    workers:
      - task-queue: workflow-scheme
        workflow-classes:
          - ru.latyshev.workflow.orchestrator.SchemeInterpreterWorkflowImpl
        activity-beans:
          - aiAgentActivityImpl
          - restCallActivityImpl

springdoc:
  api-docs:
    path: /api-docs
